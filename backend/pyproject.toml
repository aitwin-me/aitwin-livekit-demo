[project]
name = "aitwin-livekit-demo"
version = "0.1.0"
description = "LiveKit Agents (STT+LLM text-only) + AiTwin browser TTS/avatar demo"
requires-python = ">=3.10,<3.15"
dependencies = [
  "flask>=3.0.0",
  "flask-cors>=4.0.0",
  "livekit-agents[openai,silero]>=1.5.17,<2.0.0",
  "livekit-api>=1.1.0",
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent", "token_server"]
